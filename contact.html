<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>
        PinkGoose - Contact
    </title>
    <link href="css/pinkgoose.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Lato:400,700,900" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,500,700,800" rel="stylesheet" />



</head>

<body>
    <!-- Bovenaan staat het menu van de website -->
    <header class="container">
        <a class="logo" href="pinkgoose.html">
            Pink
            <span class="pink">
                Goose
            </span>
        </a>
        <nav class="home">
            <a href="pinkgoose.html">
                Home
            </a>
            <a href="learn.html">
                Learn
            </a>
            <a href="about.html">
                About
            </a>
            <a href="contact.html">
                Contact
            </a>
        </nav>
        <span class="login">
            Login
        </span>
    </header>
    <!-- Inhoud van deze pagina -->
    <main class="contact-page">
        <section class="goose-idea">
            <h1 class="idea-title">
                What's your GOOSE idea?
            </h1>
            <p>
                Let's chat and see how we can help
            </p>
            <div class="idea-buttons">
                <span class="telegram-button">
                    <img alt="Telegram" src="images/telegram.png" />
                    <div>
                        <strong class="button-name">
                            Telegram
                        </strong>
                        <small class="button-small">
                            Join our community
                        </small>
                    </div>
                </span>
                <span class="email-button">
                    <img alt="Email" src="images/email.png" />
                    <div>
                        <strong class="button-name">
                            Email
                        </strong>
                        <small class="button-small">
                            hello@superdao.co
                        </small>
                    </div>
                </span>
            </div>
        </section>
        <section class="contact-form-section">
            <h2>
                Send a post Goose
            </h2>
            <!-- Hier kan je je gegevens invullen -->
            <form action="#" class="contact-form" novalidate="">
                <input aria-label="Your email" placeholder="Your email" type="email" />
                <input aria-label="Your name" placeholder="Your name" type="text" />
                <textarea aria-label="Your message" placeholder="Your message"></textarea>
                <select aria-label="Color of your goose">
                    <option>
                        Color of your goose
                    </option>
                    <option>
                        Red
                    </option>
                    <option>
                        White
                    </option>
                    <option>
                        Blue
                    </option>
                    <option>
                        Black
                    </option>
                </select>
                <button type="button">
                    Send
                </button>
            </form>
        </section>
    </main>
    <!-- Onderaan staan de links en social media -->
    <footer class="footer">
        <div class="footer-container">
            <nav class="footer-links">
                <span>
                    About
                </span>
                <span>
                    Jobs
                </span>
                <span class="legal">
                    Legal
                </span>
            </nav>
            <nav class="footer-socials">
                <span class="social-icon">
                    <img alt="Twitter" src="images/twitter.png" />
                </span>
                <span class="social-icon">
                    <img alt="Telegram" src="images/telegram2.png" />
                </span>
                <span class="social-icon">
                    <img alt="YouTube" src="images/youtube.png" />
                </span>
                <span class="social-icon">
                    <img alt="Discord" src="images/discord.png" />
                </span>
            </nav>
        </div>
    </footer>
</body>

</html>
